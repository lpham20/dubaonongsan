services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=64MB
      -c work_mem=4MB
      -c max_connections=40
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketai}
      POSTGRES_USER: ${POSTGRES_USER:-marketai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-backup:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketai} -d ${POSTGRES_DB:-marketai}"]
      interval: 10s
      timeout: 5s
      retries: 8
    shm_size: 256m
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 96m

  api:
    build:
      context: ../backend
    restart: unless-stopped
    env_file:
      - ../backend/.env.production
    environment:
      MARKETAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketai}
      MARKETAI_ENVIRONMENT: production
      MARKETAI_START_SCHEDULER_IN_API: "false"
      MARKETAI_JOB_LOCK_DIR: /app/.job_locks
      MARKETAI_ML_ARTIFACTS: /app/ml_artifacts
      MARKETAI_ML_MAX_MODELS: "1"
      MARKETAI_RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      MARKETAI_RELEASE: ${MARKETAI_RELEASE:-unknown}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - job_locks:/app/.job_locks
      - ml_artifacts:/app/ml_artifacts:ro
    expose:
      - "8010"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8010/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 650M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file:
      - ../backend/.env.production
    environment:
      MARKETAI_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marketai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketai}
      MARKETAI_ENVIRONMENT: production
      MARKETAI_START_SCHEDULER_IN_API: "false"
      MARKETAI_JOB_LOCK_DIR: /app/.job_locks
      MARKETAI_ML_ARTIFACTS: /app/ml_artifacts
      MARKETAI_ML_MAX_MODELS: "1"
      MARKETAI_RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
      MARKETAI_RELEASE: ${MARKETAI_RELEASE:-unknown}
      SENTRY_DSN_BACKEND: ${SENTRY_DSN_BACKEND:-}
    volumes:
      - job_locks:/app/.job_locks
      - ml_artifacts:/app/ml_artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,urllib.request; r=urllib.request.urlopen('http://api:8010/api/v1/health/scrape', timeout=10); body=json.loads(r.read().decode()); sys.exit(0 if body.get('status') == 'ok' else 1)\""]
      interval: 30m
      timeout: 15s
      retries: 2
      start_period: 5m
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 650M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-dubaonongsan.com,www.dubaonongsan.com}
      API_DOMAIN: ${API_DOMAIN:-api.dubaonongsan.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./redirects.caddy:/etc/caddy/redirects.caddy:ro
      - ../frontend/dist:/var/www/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 160m
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --header 'Host: dubaonongsan.com' http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_RCLONE_CONFIG_B64: ${BACKUP_RCLONE_CONFIG_B64:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-dubaonongsan-backups}
      MARKETAI_BACKUP_REMOTE: ${MARKETAI_BACKUP_REMOTE:-}
    volumes:
      - ./postgres-backup:/backups
    mem_limit: 128m
    entrypoint: |
      sh -c '
      cat > /usr/local/bin/marketai-postgres-backup <<'"'"'EOF'"'"'
      #!/bin/sh
      set -eu
        DATE=$$(date +%Y%m%d-%H%M%S)
        BACKUP_FILE=/backups/dubaonongsan-$$DATE.dump
        pg_dump -h postgres -U ${POSTGRES_USER:-marketai} -d ${POSTGRES_DB:-marketai} -Fc -f "$$BACKUP_FILE"
        if [ -n "$${R2_ACCESS_KEY_ID:-}" ] && [ -n "$${R2_SECRET_ACCESS_KEY:-}" ] && [ -n "$${R2_ENDPOINT:-}" ]; then
          cat > /tmp/rclone.conf <<RCLONE
[r2]
type = s3
provider = Cloudflare
access_key_id = $${R2_ACCESS_KEY_ID}
secret_access_key = $${R2_SECRET_ACCESS_KEY}
endpoint = $${R2_ENDPOINT}
region = auto
RCLONE
          command -v rclone >/dev/null 2>&1 || apk add --no-cache rclone >/dev/null
          rclone copy "$$BACKUP_FILE" "r2:$${R2_BUCKET_NAME:-dubaonongsan-backups}/daily/" --config /tmp/rclone.conf --transfers 1 --retries 3 --low-level-retries 5
        elif [ -n "$${MARKETAI_BACKUP_REMOTE:-$${BACKUP_RCLONE_REMOTE:-}}" ]; then
          if [ -n "$${BACKUP_RCLONE_CONFIG_B64:-}" ]; then
            mkdir -p /root/.config/rclone
            printf "%s" "$$BACKUP_RCLONE_CONFIG_B64" | base64 -d > /root/.config/rclone/rclone.conf
          fi
          command -v rclone >/dev/null 2>&1 || apk add --no-cache rclone >/dev/null
          rclone copy "$$BACKUP_FILE" "$${MARKETAI_BACKUP_REMOTE:-$${BACKUP_RCLONE_REMOTE}}" --retries 3 --low-level-retries 5
        fi
        find /backups \( -name "backup-*.dump" -o -name "dubaonongsan-*.dump" \) -type f -mtime +7 -delete
      EOF
      chmod +x /usr/local/bin/marketai-postgres-backup
      /usr/local/bin/marketai-postgres-backup || true
      echo "0 3 * * * /usr/local/bin/marketai-postgres-backup >> /proc/1/fd/1 2>> /proc/1/fd/2" > /etc/crontabs/root
      exec crond -f -l 8'

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  caddy_logs:
  job_locks:
  ml_artifacts:
